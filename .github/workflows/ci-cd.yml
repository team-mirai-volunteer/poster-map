name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1

jobs:
  # Test jobs
  test-normalizer:
    name: Test Normalizer Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./normalizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'normalizer/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python test_integration.py
          python test_reverse_geocoding.py

  # Deploy jobs - only run on push to main/master
  deploy-map2csv:
    name: Deploy Map2CSV to Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    defaults:
      run:
        working-directory: ./map2csv
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          make build-linux
          make push
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy webtool-map2csv \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/map2csv/webtool-map2csv \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8501 \
            --memory 1Gi \
            --cpu 1 \
            --max-instances 10 \
            --service-account=${{ secrets.SA_MAP2CSV }}

  deploy-normalizer:
    name: Deploy Normalizer to Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    defaults:
      run:
        working-directory: ./normalizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          make build-linux
          make push
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy csv-normalizer \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/normalizer/csv-normalizer \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8501 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 3600 \
            --max-instances 10 \
            --service-account=${{ secrets.SA_NORMALIZER }}
